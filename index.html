<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دکتر علیرضا قاسمی | دکترای فرآیند</title>
  <style>
    :root {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --text-main: #18181b;
      --text-muted: #71717a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border-color: #e4e4e7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #09090b;
        --card-bg: #18181b;
        --text-main: #f4f4f5;
        --text-muted: #a1a1aa;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --border-color: #27272a;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .avatar-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--accent);
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .brand-title .highlight {
      color: var(--accent);
    }

    .brand-domain {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      font-family: monospace;
      letter-spacing: 1px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .link-btn:hover {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="avatar-container">
      <img src="avatar.jpg" alt="دکتر علیرضا قاسمی">
    </div>

    <h1>دکتر علیرضا قاسمی</h1>
    <p class="subtitle">دکترای فرآیند</p>

    <!-- بخش معرفی برند با C و L رنگی -->
    <div class="brand-title">
      <span class="highlight">C</span>yber <span class="highlight">L</span>ife Tips
    </div>
    <div class="brand-domain">CLTips.ir</div>

    <div class="links">
      <a href="https://instagram.com/cyberlifetips" class="link-btn" target="_blank">
        اینستاگرام (CyberLifeTips@)
      </a>
      <a href="https://t.me/CyberLifeTips_Bot" class="link-btn" target="_blank">
        ربات تلگرام
      </a>
      <a href="https://github.com/Dr-Alireza-Ghasemi" class="link-btn" target="_blank">
        گیت‌هاب
      </a>
    </div>
  </main>

</body>
</html>
